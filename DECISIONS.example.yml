# DECISIONS.yml
# Current active decision list (mutable) for DOD (Decision Oriented Development)
# Structure: category -> main decisions -> sub-decisions (up to 5 levels)
# Start by checking only this file when making a new decision.
# See the corresponding record file for detailed decision history.
# Sub-decisions inherit the nearest parent link unless they point to a different record.
# Use top-level categories for concern/domain grouping.
# Express specification, design, implementation, and test concerns as decisions or sub-decisions
# inside the relevant category when they independently constrain work.

version: "1.0"
decisions:

  Feature:
    - id: feature-001-profile-editing
      decision: User profile editing capability. This feature constrains current UI, API, and validation work across the app
      status: "⚠️Implementing"
      link: "records/feature-001-profile-editing.md"
      sub_decisions:
        - id: feature-001-1-spec-fields
          decision: Editable fields and validation rules. The API and form schema must agree on allowed fields before implementation
          status: "⚠️Discussion Approved"
          sub_decisions: []
        - id: feature-001-2-design-boundary
          decision: Server and client responsibility boundary. Component structure and mutation flow depend on where state and actions live
          status: "⚠️Implementing"
          sub_decisions: []
        - id: feature-001-3-test-acceptance
          decision: Acceptance coverage for success and rejection paths. The feature is incomplete unless valid updates succeed and invalid input is rejected
          status: "⚠️Discussion Approved"
          sub_decisions: []

  Architecture:
    - id: r-007
      decision: Frontend framework selection. App Router issues remained unresolved; prioritize simple data loading and performance
      status: "✅️Implementation Approved"
      sub_decisions:
        - id: r-007-1
          decision: Routing strategy. Adopt file-based routing and leverage nested routes
          status: "⚠️Discussion Approved"
          sub_decisions: []
        - id: r-007-2
          decision: Data fetching strategy. Prefer Server Components and minimize Client Components
          status: "⚠️Implementing"
        - id: r-007-3
          decision: Form interaction boundary. Keep complex interactive form state in narrowly scoped client components
          status: "⚠️Discussion In Progress"

  Database:
    - id: r-001
      decision: Primary database adoption. Prioritize strong ACID transactions and scalability
      status: "✅️Implementation Approved"
      sub_decisions:
        - id: r-001-1
          decision: Read scaling. Read Replica complemented by Citrus
          status: "⛔️On Hold"
        - id: r-001-2
          decision: Schema migration workflow. Run reviewed forward-only migrations in CI before deployment
          status: "⚠️Discussion Approved"

  Authentication and Security:
    - id: r-012
      decision: Authentication approach selection. Best balance between security and development speed
      status: "⚠️Discussion In Progress"
      sub_decisions:
        - id: r-012-1
          decision: Session storage strategy. Use server-side sessions so revocation remains centrally enforceable
          status: "⚠️Discussion Approved"
        - id: r-012-2
          decision: MFA rollout scope. Require MFA first for admin roles before expanding to all users
          status: "⚠️Discussion In Progress"

  Operations and CI/CD:
    - id: r-015
      decision: Automated dependency updates. Enable rapid response to security patches
      status: "⚠️Implementing"
      sub_decisions:
        - id: r-015-1
          decision: Update frequency and review policy. Create automated PRs weekly and require manual review
          status: "⚠️Discussion Approved"
        - id: r-015-2
          decision: Dependency update merge gate. Merge only after tests, type checks, and security review pass
          status: "✅️Implementation Approved"
