version: "1.0"
decisions:

  DOD Agent:
    - id: agent-001-dod-custom-agent
      decision: Create a dedicated DOD custom agent in VS Code. A persistent persona with constrained tools is required to keep implementation aligned with DOD decisions.
      status: "✅️Implementation Approved"
      link: "records/agent-001-dod-custom-agent.md"
      sub_decisions:
        - id: agent-001-1-workspace-agent-location
          decision: Define the DOD custom agent as a workspace file under .github/agents. The agent must be discoverable in the repository without relying on user-local configuration.
          status: "✅️Implementation Approved"
        - id: agent-001-2-phase-and-artifact-guidance
          decision: Require explicit DOD phase and artifact guidance in the custom agent. The agent must explicitly enforce discussion and implementation behavior to reduce decision drift.
          status: "✅️Implementation Approved"
        - id: agent-001-3-shared-workspace-reusability
          decision: Keep the DOD custom agent reusable without contributor-local manual edits. The agent should work as a shared workspace runtime rather than depending on machine-specific setup.
          status: "✅️Implementation Approved"
        - id: agent-001-4-discussion-record-template-usage
          decision: Require new records files to be created from the installed discussion-record template. Mandatory template usage keeps record structure consistent and prevents ad hoc record formats.
          status: "✅️Implementation Approved"

    - id: agent-006-agent-orchestration-model
      decision: Use one main DOD agent with sequential phase skills and exceptional read-only subagent assistance. DOD phase gates require one accountable controller, while phase procedures remain reusable as skills and read-only subagent assistance should stay exceptional because it adds handoff cost.
      status: "⚠️Discussion Approved"
      link: "records/agent-006-agent-orchestration-model.md"
      sub_decisions:
        - id: agent-006-1-main-agent-governance
          decision: Keep one main DOD agent responsible for flow control and final gate judgment. Gate A, Gate B, and Gate C need a single authority for artifact order, status progression, and completion judgment.
          status: "⚠️Discussion Approved"
        - id: agent-006-2-phase-skills-default
          decision: Execute discussion, discussion-validation, decision-promotion, implementation, and implementation-validation sequentially under the main agent by default. Sequential skill execution preserves active decision continuity across Gate A and Gate B without paying the handoff cost of per-skill subagent orchestration.
          status: "⚠️Discussion Approved"
          link: "records/agent-008-phase-skill-set.md"
        - id: agent-006-3-validation-owned-consistency-checks
          decision: Keep validation-owned consistency checks inside the discussion-validation and implementation-validation skills. Consistency checking belongs to validation, and current artifacts should describe those checks explicitly rather than as a separate capability or vague default behavior.
          status: "⚠️Discussion Approved"
          link: "records/agent-008-phase-skill-set.md"
        - id: agent-006-4-audit-agent-exception
          decision: Introduce a separate read-only audit agent only when independence or scale justifies it. A dedicated audit agent adds orchestration cost and should be reserved for cases where audit independence or workload justifies the extra runtime separation.
          status: "⚠️Discussion Approved"
        - id: agent-006-5-subagent-assistance-exception
          decision: Use subagents only as exceptional read-only assistance under the main agent. Subagents can help with independence, search volume, or fresh validation perspective, but final judgment and artifact updates must remain with the main agent.
          status: "⚠️Discussion Approved"
          link: "records/agent-006-agent-orchestration-model.md"

  Skills:
    - id: agent-008-phase-skill-set
      decision: Define the default DOD skill package as five operational skills across Gate A and Gate B. The reusable procedures should be explicit and complete, while the main DOD agent retains flow control and final gate judgment.
      status: "⚠️Implementing"
      link: "records/agent-008-phase-skill-set.md"
      sub_decisions:
        - id: agent-008-1-discussion-skill
          decision: Provide a dedicated discussion skill for discussion-phase research and record drafting. Discussion work should be reusable as a focused procedure without moving gate ownership away from the main agent.
          status: "⚠️Implementing"
        - id: agent-008-2-discussion-validation-skill
          decision: Provide a dedicated discussion-validation skill for directional checks before decision promotion. Directional fit should be reusable as an explicit step before promotion work begins.
          status: "⚠️Implementing"
        - id: agent-008-6-decision-promotion-skill
          decision: Provide a dedicated decision-promotion skill for converting approved discussion results into active decision objects. Promotion is a distinct operational step that must update decision objects, contracts, statuses, and links consistently after validation passes.
          status: "⚠️Implementing"
          link: "records/agent-008-phase-skill-set.md"
        - id: agent-008-3-implementation-skill
          decision: Provide a dedicated implementation skill for target-shape design and validation-friendly integration. Implementation work should derive the intended result from the active decision set and integrate it in a sensible order under the main agent's governance.
          status: "⚠️Implementing"
        - id: agent-008-4-implementation-validation-skill
          decision: Provide a dedicated implementation-validation skill for artifact checks before closeout. Closeout validation should be reusable as an explicit procedure that confirms tests, code, and related artifacts match the promoted decisions.
          status: "⚠️Implementing"
        - id: agent-008-7-explicit-implementation-validation-checklist
          decision: Make implementation-validation enumerate the concrete closeout checks it must perform. Implementation-validation should explicitly state what must be verified at closeout so operators do not infer or skip artifact alignment, terminology, decision hygiene, or blocker reporting.
          status: "⚠️Implementing"
          link: "records/agent-008-phase-skill-set.md"
        - id: agent-008-8-decision-scoped-target-shape-implementation
          decision: Let promoted decisions define implementation scope while implementation chooses target shape and integration order. In DOD, implementation scope comes from the promoted decisions, so the implementation skill should focus on designing the intended shape and integrating it safely rather than self-defining minimal scope.
          status: "⚠️Implementing"
          link: "records/agent-008-phase-skill-set.md"
        - id: agent-008-5-broad-then-focus-discussion
          decision: Start discussion with a bounded broad scan before narrowing to focus areas. Discussion work must first surface affected domains and omission risks; narrowing too early imports implementation-style locality and risks missing active constraints.
          status: "⚠️Implementing"
          link: "records/agent-008-phase-skill-set.md"

  Installer:
    - id: agent-002-installer-delivery
      decision: Provide a repository installer for the DOD agent package. Provide the installer delivery mechanism and keep its active sub-decisions explicit in this list.
      status: "✅️Implementation Approved"
      link: "records/agent-002-installer-delivery.md"
      sub_decisions:
        - id: agent-002-1-installer-template-assets
          decision: Use template files as installer inputs. Templates keep source assets separate from target outputs and make future CLI expansion safer.
          status: "✅️Implementation Approved"
        - id: agent-002-2-installer-target-scope
          decision: Support copilot, cursor, and grok as the bounded installer CLI target set. Grok is an explicit workspace-local convention target whose target-specific files are placed under .grok, while the active target set remains small and explicit so rollout and validation stay predictable.
          status: "✅️Implementation Approved"
          link: "records/agent-011-grok-install-target.md"
        - id: agent-002-3-idempotent-reruns
          decision: Keep the installer safe to run repeatedly. Re-running the installer must not duplicate configuration or corrupt existing installed assets.
          status: "✅️Implementation Approved"
        - id: agent-002-4-workspace-scope-only
          decision: Limit installer writes to intended workspace customization paths. The installer must stay inside declared workspace scope instead of modifying broader user or system locations.
          status: "✅️Implementation Approved"
        - id: agent-002-5-explicit-cli-target-validation
          decision: Require an explicit CLI target and reject unsupported targets. Installer behavior must stay predictable and must not silently accept unsupported target modes.
          status: "✅️Implementation Approved"
        - id: agent-002-6-fail-fast-and-validation-guidance
          decision: Fail fast with explicit errors and print post-install validation steps. Installation must stop clearly on invalid state and tell the user how to verify success afterward.
          status: "✅️Implementation Approved"
        - id: agent-002-7-supported-target-names
          decision: Use `copilot`, `cursor`, and `grok` as the supported installer CLI target values. The installer needs stable explicit target names for all supported runtimes so invocation and validation do not drift.
          status: "✅️Implementation Approved"
          link: "records/agent-011-grok-install-target.md"
        - id: agent-002-8-existing-file-overwrite-policy
          decision: Treat files declared in an installer target manifest as managed outputs and overwrite changed files on reinstall without creating backups. When `--overwrite` is omitted, use the `ask` policy: interactive runs ask with `Overwrite this file? [Y/n/a] (a = all remaining files):`, where Enter accepts only the current file, `n` preserves only the current file, and `a` accepts the current file and switches the current install to overwrite all subsequent changed managed files without confirmation. Do not provide an all-no shortcut. `--overwrite yes` overwrites changed managed files without confirmation, and `--overwrite no` preserves them without confirmation. If `ask` has no usable terminal, update automatically because no answer can be obtained. Explicit `--overwrite yes|no` takes precedence over terminal detection, the `a` transition is session-scoped, and DECISIONS.yml remains protected.
          status: "✅️Implementation Approved"
          link: "records/agent-002-installer-delivery.md"
        - id: agent-002-9-initial-copilot-template-manifest
          decision: Install templates/agent.md and templates/DECISIONS.yml into the initial Copilot workspace paths. The first release needs an explicit template file set and destination mapping so installer behavior stays deterministic.
          status: "✅️Implementation Approved"
        - id: agent-002-10-decisions-yml-never-overwrite
          decision: Never overwrite an existing DECISIONS.yml regardless of `--overwrite yes|no` or an interactive all-files selection. DECISIONS.yml contains project-specific decision records that would be permanently lost on overwrite; the installer must always preserve it.
          status: "✅️Implementation Approved"
        - id: agent-002-11-no-template-fallback-copy
          decision: Do not save a fallback copy such as DECISIONS.template.yml when DECISIONS.yml already exists. A fallback copy adds filesystem noise without clear benefit; the upstream template is always available via the source repository.
          status: "✅️Implementation Approved"
        - id: agent-002-12-discussion-record-template-install
          decision: Include templates/discussion-record.md in installer-managed template assets. New decision records should start from a consistent template so the installer must distribute this asset alongside other templates.
          status: "✅️Implementation Approved"
        - id: agent-002-13-copilot-skill-template-install
          decision: Include the five shipped skill templates in the Copilot installer manifest. The Copilot installer must provision the reusable DOD skills alongside the agent and discussion-record assets so the installed workflow is complete.
          status: "✅️Implementation Approved"
          link: "records/agent-002-installer-delivery.md"
        - id: agent-002-14-initial-cursor-template-manifest
          decision: Install Cursor rule outputs rendered from shared DOD sources plus shared DOD assets into the initial Cursor workspace paths. Cursor support still needs an explicit manifest, but the manifest should point at shared DOD sources and let the installer render the Cursor-specific rule wrapper instead of storing duplicated source files.
          status: "✅️Implementation Approved"
          link: "records/agent-009-cursor-install-target.md"
        - id: agent-002-15-initial-grok-template-manifest
          decision: Install the shared DOD agent and five skill sources directly into .grok as .grok/dod.agent.md and .grok/<skill-name>.skill.md. Keep DECISIONS.yml and .dodkit/templates/discussion-record.md at their existing shared workspace paths instead of creating Grok-specific copies.
          status: "✅️Implementation Approved"
          link: "records/agent-011-grok-install-target.md"
        - id: agent-002-16-grok-discovery-boundary
          decision: Treat .grok as a user-directed workspace convention for Grok instructions, not as an officially discovered or automatically applied Grok configuration directory. Installer documentation must describe the convention without claiming native Grok discovery behavior.
          status: "✅️Implementation Approved"
          link: "records/agent-011-grok-install-target.md"

    - id: agent-003-raw-github-install
      decision: Deliver installer entrypoint through raw.githubusercontent.com and pipe install.sh to bash. GitHub raw content hosting allows direct script delivery; using the official raw host avoids invalid-domain failures.
      status: "✅️Implementation Approved"
      link: "records/agent-003-raw-github-install.md"
      sub_decisions:
        - id: agent-003-1-curl-fssl-command
          decision: Use curl -fsSL for the install.sh one-line command. The command must fail on HTTP errors while staying quiet and diagnosable for shell-based installation.
          status: "✅️Implementation Approved"
        - id: agent-003-2-stable-ref-guidance
          decision: Default installer URLs to a stable ref and allow commit pinning for reproducibility. Install instructions need a stable default while preserving a deterministic option when stronger reproducibility is required.
          status: "✅️Implementation Approved"

  Template:
    - id: agent-004-installer-template-details
      decision: Define installer template file layout and output mapping. Template usage is already active, but template file structure and output mapping need their own explicit decision before implementation.
      status: "✅️Implementation Approved"
      link: "records/agent-004-installer-template-details.md"
      sub_decisions:
        - id: agent-004-1-template-path
          decision: Store the initial template at templates/agent.md. A top-level template path is simple now and still leaves room for future expansion.
          status: "✅️Implementation Approved"
        - id: agent-004-2-copy-manifest
          decision: Keep the installer copy-target list inside the installer as explicit per-target asset specifications. Each specification must keep source path, destination path, and asset name together in source|destination|asset_name form so the mapping can be reviewed as one unit instead of being inferred through parallel-array indexes.
          status: "✅️Implementation Approved"
        - id: agent-004-3-source-destination-rule
          decision: Use raw.githubusercontent.com as source and current-directory-relative paths as destination. Source and destination resolution must stay explicit and consistent for installer execution.
          status: "✅️Implementation Approved"
        - id: agent-004-4-separate-template-sources-and-outputs
          decision: Keep template source files separate from installed output files. Template assets and installed customization outputs must not be mixed if file mapping is to remain stable and understandable.
          status: "✅️Implementation Approved"
        - id: agent-004-5-discussion-record-template-destination
          decision: Install discussion-record template at .dodkit/templates/discussion-record.md. A DODKit-scoped hidden directory keeps workspace root clean while providing a stable, tool-neutral location for future template expansion.
          status: "✅️Implementation Approved"
        - id: agent-004-6-skill-template-source-layout
          decision: Store shipped skill source templates under templates/skills as one .skill.md file per skill. A dedicated source directory keeps reusable skill content separate from installed discovery paths while making the five-skill package reviewable and translatable in the repository.
          status: "✅️Implementation Approved"
          link: "records/agent-008-phase-skill-set.md"
        - id: agent-004-7-copilot-skill-template-destinations
          decision: Install each templates/skills/*.skill.md source to .github/skills/<name>/SKILL.md for Copilot. Copilot skill discovery needs a deterministic runtime path, and the installer must map repository skill templates to that path without mixing source and output files.
          status: "✅️Implementation Approved"
          link: "records/agent-004-installer-template-details.md"
        - id: agent-004-8-cursor-rule-template-source-layout
          decision: Reuse templates/agent.md and templates/skills/*.skill.md as the shared source set for Cursor rule rendering. The rule body content is shared with Copilot, so keeping dedicated Cursor source files would duplicate almost identical content and create avoidable maintenance drift.
          status: "✅️Implementation Approved"
          link: "records/agent-009-cursor-install-target.md"
        - id: agent-004-9-cursor-rule-template-destinations
          decision: Render shared DOD sources to .cursor/rules/<name>.mdc outputs for Cursor. Cursor project rules are still discovered from deterministic workspace paths, but the runtime files should now be rendered outputs rather than direct copies of duplicated source templates.
          status: "✅️Implementation Approved"
          link: "records/agent-009-cursor-install-target.md"
        - id: agent-004-10-cursor-manual-rule-frontmatter
          decision: Render the Cursor DOD rule wrapper as opt-in manual project rules rather than always-applied instructions. Manual Cursor rules preserve the existing explicit-entry workflow more closely than always-applied guidance and avoid constraining unrelated chat sessions by default, so the installer must synthesize that frontmatter around the shared body content.
          status: "✅️Implementation Approved"
          link: "records/agent-009-cursor-install-target.md"
        - id: agent-004-11-grok-asset-destinations
          decision: Direct-copy the shared DOD agent and skill sources into the .grok directory using flat target-specific destinations: .grok/dod.agent.md and .grok/<skill-name>.skill.md. Grok assets do not receive Cursor frontmatter or another target-specific rendering wrapper.
          status: "✅️Implementation Approved"
          link: "records/agent-011-grok-install-target.md"

    - id: agent-005-lightweight-template-roles
      decision: Define lightweight template roles without adding a separate decision phase. DOD must stay lightweight, and current AI friction comes from artifact overlap rather than from a missing phase.
      status: "✅️Implementation Approved"
      link: "records/agent-005-lightweight-template-roles.md"
      sub_decisions:
        - id: agent-005-1-two-phase-dod
          decision: Keep decision recording inside the discussion phase rather than adding a third phase. The discussion phase already runs until decisions are explicit, so a separate decision phase would add process weight with little new operational value.
          status: "✅️Implementation Approved"
        - id: agent-005-2-decisions-template-scanability
          decision: Keep the DECISIONS.yml template optimized for human scanability. The canonical decision list must remain easy to scan, so the default decision shape should stay minimal.
          status: "✅️Implementation Approved"
        - id: agent-005-3-contract-details-as-needed
          decision: Express only necessary contract details as additional sub-decisions. Decision contracts must be explicit, but forcing the same contract fields onto every node would reduce scanability and add redundant work.
          status: "✅️Implementation Approved"
        - id: agent-005-4-discussion-record-minimal-structure
          decision: Keep the discussion-record template lightweight and focused on history. The record template should require only minimal discussion history so AI can preserve artifact order without duplicating current constraints from DECISIONS.yml.
          status: "✅️Implementation Approved"
        - id: agent-005-5-optional-record-detail
          decision: Make evidence and detailed promotion metadata optional in discussion records. Optional detail keeps the template usable for small discussions while preserving room for deeper records when needed.
          status: "✅️Implementation Approved"

    - id: agent-010-decision-single-field
      decision: Replace split descriptive fields in DECISIONS.yml with one decision field. A single field reduces AI-authored drift between labels and constraints and keeps active constraints semantically linked.
      status: "✅️Implementation Approved"
      link: "records/agent-010-decision-single-field.md"
      sub_decisions:
        - id: agent-010-1-decision-single-field-length
          decision: Keep each decision field concise while allowing up to about three lines when the binding constraint needs extra clarity. This preserves scanability without forcing semantic split across multiple fields.
          status: "✅️Implementation Approved"

    - id: agent-013-discussion-record-boundaries
      decision: Keep each DOD discussion record focused on one cohesive decision theme and add explicit split guidance to the record template and discussion skill. Start a new discussion ID at an independent decision boundary or when the record reaches the practical size signal, while preserving append-only history and prior-record references.
      status: "✅️Implementation Approved"
      link: "records/agent-013-discussion-record-boundaries.md"
      sub_decisions:
        - id: agent-013-1-one-theme-per-record
          decision: Keep one discussion record for one cohesive decision theme. A genuinely independent question, component, or follow-up must start a new record with a new discussion ID and reference the prior record instead of extending unrelated history.
          status: "✅️Implementation Approved"
        - id: agent-013-2-practical-record-size-signal
          decision: Treat roughly 10 entries or 1,000 words as a reviewability signal to close at a natural boundary and continue in a new record. This is a heuristic, not a hard parser-enforced limit.
          status: "✅️Implementation Approved"
        - id: agent-013-3-lightweight-boundary-nongoals
          decision: Keep the split guidance lightweight; do not add a third DOD phase, mandatory record fields, or a new installer asset mapping. Same-theme entries may remain in the current record when they stay concise and reviewable.
          status: "✅️Implementation Approved"
        - id: agent-013-4-template-skill-sync-acceptance
          decision: Keep equivalent boundary guidance in templates/discussion-record.md and templates/skills/discussion.skill.md, and synchronize their installed shared copies and Japanese mirrors. Validation fails if either source surface omits the independent-theme trigger or practical size signal.
          status: "✅️Implementation Approved"

  DOD Process:
    - id: agent-007-phase-verification-model
      decision: Keep DOD as a two-phase method while making phase-specific verification explicit. DOD needs directional validation before decision promotion and implementation validation before closeout, but adding a separate verification phase would add process weight without enough new value.
      status: "✅️Implementation Approved"
      link: "records/agent-007-phase-verification-model.md"
      sub_decisions:
        - id: agent-007-1-no-third-phase
          decision: Keep verification inside the existing two-phase model instead of adding a third phase. Discussion and implementation already provide the needed lifecycle boundaries, so a separate verification phase would mostly duplicate work and increase friction.
          status: "✅️Implementation Approved"
        - id: agent-007-2-discussion-validation-before-promotion
          decision: Require lightweight discussion-validation before promoting candidate conclusions into DECISIONS.yml. A decision can be implemented correctly yet still be directionally wrong, so the proposed direction must be checked against the original objective and active constraints before it becomes binding.
          status: "✅️Implementation Approved"
        - id: agent-007-3-implementation-validation-before-closeout
          decision: Require implementation-validation against active decisions before closing implementation work. Decisions remain advisory unless tests, code, and related artifacts are checked against the promoted decision set before closeout.
          status: "✅️Implementation Approved"

    - id: agent-012-decision-file-scope-and-hierarchy
      decision: Keep root DECISIONS.yml as the project-wide baseline and allow future nested DECISIONS.yml files only as additive constraints for their directory subtrees. Applicable decisions resolve from root through the nearest ancestor; cross-component constraints stay at root. Report parent-child conflicts explicitly: interactive runs ask the user, while non-interactive runs warn and prefer the child only when the scope relation is unambiguous; unresolved ambiguity fails validation.
      status: "✅️Implementation Approved"
      link: "records/agent-012-decision-file-scope-and-hierarchy.md"
      sub_decisions:
        - id: agent-012-1-root-baseline
          decision: Preserve the root DECISIONS.yml as the shared project-level canonical file. Nested files must not replace or hide root decisions, and the current install.sh remains root-oriented.
          status: "✅️Implementation Approved"
        - id: agent-012-2-nested-additive-scope
          decision: Treat a nested DECISIONS.yml as optional and applicable only to its directory subtree. Resolve the effective set by combining the root and applicable ancestor files from broadest to narrowest scope.
          status: "✅️Implementation Approved"
        - id: agent-012-3-cross-scope-conflict
          decision: Keep decisions affecting multiple components in the root file. Do not silently resolve parent-child conflicts: unambiguous parent-child conflicts use the explicit interaction-mode policy in agent-012-5, while same-scope or otherwise ambiguous duplicates remain validation failures.
          status: "✅️Implementation Approved"
        - id: agent-012-4-hierarchy-runtime-deferred
          decision: Do not activate nested-file discovery or merging yet. A later implementation decision must define file discovery, decision identity, conflict validation, and tests before hierarchical behavior is enabled.
          status: "✅️Implementation Approved"
        - id: agent-012-5-actionable-conflict-resolution
          decision: Report the applicable file paths, decision IDs, conflicting constraints, and selected fallback. In interactive mode, ask the user to resolve an unambiguous parent-child conflict; in non-interactive mode, warn and continue with the narrower child decision. Do not auto-resolve same-scope or otherwise ambiguous conflicts.
          status: "✅️Implementation Approved"

    - id: agent-014-decision-document-ownership
      decision: Keep each project-specific DOD binding constraint canonical in the applicable DECISIONS.yml and prevent its decision text from being duplicated across operational or explanatory documents. Use records for rationale and let other documents change only for independently required content.
      status: "✅️Implementation Approved"
      link: "records/agent-014-decision-document-ownership.md"
      sub_decisions:
        - id: agent-014-1-canonical-project-decision-source
          decision: Treat the applicable project decision list, rooted at the project-level DECISIONS.yml under the active scope rules, as the sole canonical source for current project-specific decisions and implementation constraints. Do not create a second DOD decision authority in PRINCIPLES.md or another document.
          status: "✅️Implementation Approved"
        - id: agent-014-2-no-duplicate-project-decision-text
          decision: Do not copy the same project-specific binding decision into AGENTS.md, PRINCIPLES.md, DOD.md, README.md, or skill files. Those documents may contain distinct operational or explanatory content when their own roles require it.
          status: "✅️Implementation Approved"
        - id: agent-014-3-document-ownership-validation
          decision: Require discussion to classify document ownership before writing and discussion-validation to check for a single DECISIONS.yml owner and unjustified duplicate decision text. The corresponding English skill templates and Japanese mirrors must stay synchronized.
          status: "✅️Implementation Approved"

