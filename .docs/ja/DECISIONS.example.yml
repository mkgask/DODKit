# DECISIONS.yml
# DOD（決定指向開発）用 現在有効な決定事項一覧（可変）
# 構造：カテゴリ → メイン決定事項 → サブ決定事項（最大5層まで許容）
# 新しい決定時はこのファイルだけをまず参照。詳細経緯は対応する records ファイルを参照。
# サブ決定は別の履歴を指す必要がない限り、最も近い親の link を継承する。
# トップレベルカテゴリは関心領域またはドメインで分ける。
# 仕様・設計・実装・テストの関心は、それ自体が拘束条件になる場合に、
# 関連カテゴリ内の決定事項またはサブ決定として表現する。

version: "1.0"
decisions:

  Feature:
    - id: feature-001-profile-editing
      decision: ユーザープロフィール編集機能。この機能が現在の UI、API、バリデーション実装を横断して拘束している
      status: "⚠️Implementing"
      link: "records/feature-001-profile-editing.md"
      sub_decisions:
        - id: feature-001-1-spec-fields
          decision: 編集可能項目とバリデーション規則。実装前に API とフォームスキーマで許可項目を一致させる必要がある
          status: "⚠️Discussion Approved"
          sub_decisions: []
        - id: feature-001-2-design-boundary
          decision: サーバーとクライアントの責務境界。コンポーネント構成と更新フローが、状態とアクションの配置に依存する
          status: "⚠️Implementing"
          sub_decisions: []
        - id: feature-001-3-test-acceptance
          decision: 正常系と拒否系の受け入れテスト範囲。正しい更新成功と不正入力拒否を検証しない限り、この機能は完了と見なせない
          status: "⚠️Discussion Approved"
          sub_decisions: []

  アーキテクチャ:
    - id: r-007
      decision: フロントエンドフレームワークの選定。App Router の問題が解決されず、データロードのシンプルさとパフォーマンスを優先
      status: "✅️Implementation Approved"
      sub_decisions:
        - id: r-007-1
          decision: ルーティング方式。File-based routing を採用し、ネストされたルートを活用
          status: "⚠️Discussion Approved"
          sub_decisions: []
        - id: r-007-2
          decision: データフェッチ戦略。Server Components を優先し、Client Components は最小限にする
          status: "⚠️Implementing"
        - id: r-007-3
          decision: フォーム相互作用の境界。複雑なフォーム状態は、必要最小限の Client Component に閉じ込める
          status: "⚠️Discussion In Progress"

  データベース:
    - id: r-001
      decision: プライマリデータベースの採用。ACID トランザクションの強さと拡張性を重視
      status: "✅️Implementation Approved"
      sub_decisions:
        - id: r-001-1
          decision: 読み取りスケーリング。Read Replica + Citrus で補完
          status: "⛔️On Hold"
        - id: r-001-2
          decision: スキーママイグレーション運用。デプロイ前に、レビュー済みの forward-only migration を CI で実行する
          status: "⚠️Discussion Approved"

  認証・セキュリティ:
    - id: r-012
      decision: 認証方式の選択。セキュリティと開発速度のバランスが最適
      status: "⚠️Discussion In Progress"
      sub_decisions:
        - id: r-012-1
          decision: セッション保存戦略。失効制御を中央で維持できるよう、サーバー側セッションを採用する
          status: "⚠️Discussion Approved"
        - id: r-012-2
          decision: MFA 導入範囲。まず管理者ロールに MFA を必須化し、その後に全ユーザーへ拡張する
          status: "⚠️Discussion In Progress"

  運用・CI/CD:
    - id: r-015
      decision: 依存関係更新の自動化。セキュリティパッチへ迅速に対応する
      status: "⚠️Implementing"
      sub_decisions:
        - id: r-015-1
          decision: 更新頻度とレビュー。週次で自動 PR を作成し、手動レビューを必須にする
          status: "⚠️Discussion Approved"
        - id: r-015-2
          decision: 依存関係更新のマージ条件。テスト、型チェック、セキュリティレビュー通過後にのみマージする
          status: "✅️Implementation Approved"
